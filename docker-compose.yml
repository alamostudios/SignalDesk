services:
  signaldesk:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      STORAGE_DIR: /app/storage
    volumes:
      - signaldesk-data:/app/data
      - signaldesk-audio:/app/storage
    restart: unless-stopped
volumes:
  signaldesk-data:
  signaldesk-audio:
