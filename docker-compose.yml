services:
  signaldesk:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "${PORT:-3000}"
      DATA_DIR: /app/data
      STORAGE_DIR: /app/storage
      JWT_SECRET: "${JWT_SECRET:-}"
      PUBLIC_AUDIO_SECRET: "${PUBLIC_AUDIO_SECRET:-}"
      INGEST_API_KEY: "${INGEST_API_KEY:-}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      TIME_ZONE: "${TIME_ZONE:-UTC}"
      PAGE_TONE_HZ: "${PAGE_TONE_HZ:-1000,1500}"
      PAGE_TONE_THRESHOLD: "${PAGE_TONE_THRESHOLD:-0.18}"
      TONE_CORRELATION_SECONDS: "${TONE_CORRELATION_SECONDS:-180}"
      WHISPER_BASE_URL: "${WHISPER_BASE_URL:-}"
      WHISPER_API_KEY: "${WHISPER_API_KEY:-}"
      WHISPER_MODEL: "${WHISPER_MODEL:-whisper-1}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      FACEBOOK_PAGE_ID: "${FACEBOOK_PAGE_ID:-}"
      FACEBOOK_ACCESS_TOKEN: "${FACEBOOK_ACCESS_TOKEN:-}"
      FACEBOOK_GRAPH_VERSION: "${FACEBOOK_GRAPH_VERSION:-v23.0}"
      ALLOW_PUBLIC_EXTRA_INFO: "${ALLOW_PUBLIC_EXTRA_INFO:-false}"
    volumes:
      - signaldesk-data:/app/data
      - signaldesk-audio:/app/storage
    restart: unless-stopped
volumes:
  signaldesk-data:
  signaldesk-audio:
